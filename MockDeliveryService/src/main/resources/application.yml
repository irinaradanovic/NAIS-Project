server:
  port: 8085

spring:
  application:
    name: mock-delivery-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost} # Koristi environment varijablu, ako je nema ide na localhost
      port: 6379
  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: neo4j
      password: password
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
  influx:
    url: http://influxdb:8086
    token: my-super-secret-auth-token
    org: nais_org
    bucket: delivery_bucket

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
